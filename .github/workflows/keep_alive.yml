name: Keep Alive

on:
  schedule:
    - cron: '0 10 1 * *'  # 1ro de cada mes a las 10:00 UTC
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Re-habilitar workflow principal si fue desactivado
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily_schedule.yml/enable")
          echo "Enable workflow status: $STATUS"
          if [ "$STATUS" = "204" ]; then
            echo "Workflow principal re-habilitado exitosamente."
          else
            echo "El workflow principal ya estaba activo o hubo un error (status $STATUS)."
          fi
